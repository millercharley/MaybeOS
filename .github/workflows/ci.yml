name: CI

# This had never run, once, in the repo's history.
#
# The triggers named `main`, and there is no `main` — the default branch is
# `claude/maybeOS-suite-foundation-1Wauk`, which is also what Netlify deploys
# from. So every push went straight to production with nothing checked, and
# the workflow sat here looking like it was checking. That is also why the
# SEC-04 tenant-scoping guard lives in the jest suite and `npm run lint`
# exited 127 for months without anybody noticing (OPS-13).
#
# The deploy branch is named in full rather than filtered loosely, so it is
# obvious which branch this is about. If it is ever renamed, rename it here
# too — `pull_request` is left unfiltered so at least that half cannot go
# stale the same way.
on:
  push:
    branches:
      - claude/maybeOS-suite-foundation-1Wauk
  pull_request:
  workflow_dispatch:

jobs:
  # Named for what it does. This was `lint-and-build` and ran no lint, because
  # `npm run lint` reported 57 errors on the existing code and the step would
  # have gone red on that backlog rather than on anything the job checks. The
  # backlog is cleared, so the lint step is here — under a name that admits the
  # job runs the tests too, which `lint-and-build` never did.
  #
  # Errors fail the build and warnings do not, which is the split
  # `eslint.config.mjs` sets out: a rule that fires on the existing style is a
  # warning, a rule that has actually hidden a defect here is an error. The 59
  # warnings are visible in the log without being a gate.
  lint-build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: maybeos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/maybeos_test
      # The schema's datasource needs both (OPS-11): `DATABASE_URL` goes
      # through Supabase's transaction pooler, which cannot run migrations
      # because they need a session that holds advisory locks, so `DIRECT_URL`
      # connects straight to Postgres.
      #
      # Here they are the same string: this is a plain `postgres:16-alpine`
      # service with no pooler in front of it. It still has to be set — the
      # first CI run that ever happened failed on `Environment variable not
      # found: DIRECT_URL`, which is the same way D-007 broke a Railway
      # deploy.
      DIRECT_URL: postgresql://test:test@localhost:5432/maybeos_test
      JWT_SECRET: test-secret-key-at-least-32-characters-long

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Ahead of the database work on purpose: lint needs nothing but
      # node_modules, so a lint failure should not wait on Postgres and a
      # migration chain to be told.
      - name: Lint
        run: npm run lint

      - name: Generate Prisma client
        run: cd apps/api && npx prisma generate

      # Thirteen migrations end with `REVOKE ALL ON TABLE ... FROM anon,
      # authenticated` — Supabase's two public roles, which a plain Postgres
      # does not have. The first run to reach a migration died on
      # `role "anon" does not exist`, at `mem17_share_ledger`.
      #
      # So the chain only applies to a database that has those roles, which is
      # worth knowing and was invisible while this workflow never ran. It is
      # not a problem in production — that is Supabase — but it does mean a
      # plain local Postgres cannot take these migrations without this.
      #
      # Creating the roles here rather than rewriting the REVOKEs: those
      # migrations are applied, and editing an applied migration means
      # rewriting its checksum in every database's `_prisma_migrations` by
      # hand. CI is standing in for Supabase, so CI should look like it.
      #
      # `service_role` and `postgres` appear only in comments, so they are
      # left out rather than created on the off chance.
      - name: Create the Supabase roles the migrations revoke from
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 \
            -c 'CREATE ROLE anon NOLOGIN' \
            -c 'CREATE ROLE authenticated NOLOGIN'

      - name: Run migrations
        run: cd apps/api && npx prisma migrate deploy

      - name: Build API
        run: npm run build:api

      - name: Build Web
        run: npm run build:web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001

      - name: Run tests
        run: npm test --if-present
