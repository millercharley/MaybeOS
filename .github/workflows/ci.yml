name: CI

# This had never run, once, in the repo's history.
#
# The triggers named `main`, and there is no `main` — the default branch is
# `claude/maybeOS-suite-foundation-1Wauk`, which is also what Netlify deploys
# from. So every push went straight to production with nothing checked, and
# the workflow sat here looking like it was checking. That is also why the
# SEC-04 tenant-scoping guard lives in the jest suite and `npm run lint`
# exited 127 for months without anybody noticing (OPS-13).
#
# The deploy branch is named in full rather than filtered loosely, so it is
# obvious which branch this is about. If it is ever renamed, rename it here
# too — `pull_request` is left unfiltered so at least that half cannot go
# stale the same way.
on:
  push:
    branches:
      - claude/maybeOS-suite-foundation-1Wauk
  pull_request:
  workflow_dispatch:

jobs:
  # Named for what it does. It was `lint-and-build` and ran no lint: `npm run
  # lint` reports 59 errors on the existing code, so putting it in here would
  # go red on a backlog rather than on anything this job is checking. That
  # backlog is worth clearing on its own, and then this gets a lint step and
  # its old name back.
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: maybeos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/maybeos_test
      JWT_SECRET: test-secret-key-at-least-32-characters-long

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Generate Prisma client
        run: cd apps/api && npx prisma generate

      - name: Run migrations
        run: cd apps/api && npx prisma migrate deploy

      - name: Build API
        run: npm run build:api

      - name: Build Web
        run: npm run build:web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001

      - name: Run tests
        run: npm test --if-present
