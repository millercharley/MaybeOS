# Deliberately no [build] block here — the site's existing build command
# and publish directory (configured in the Netlify dashboard) are left
# untouched. This file is purely additive: it registers a build plugin
# that compiles the NestJS API before the functions bundling step, and
# tells Netlify where to find the resulting function.

[[plugins]]
  package = "./netlify/plugins/build-api"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

  # Prisma's generated client and its native query engine live at the
  # monorepo root (node_modules/.prisma), not under apps/api.
  included_files = ["node_modules/.prisma/client/**"]

  external_node_modules = [
    # Real dependencies that must not be inlined: native binaries, or
    # packages with dynamic internals esbuild can't statically analyze.
    "@prisma/client",
    ".prisma/client",
    "bcrypt",
    "class-transformer",
    "class-validator",

    # Optional NestJS peer dependencies — NOT installed and NOT used here
    # (microservices, websockets, and the Sequelize/TypeORM/Mongoose/
    # MikroORM health indicators in @nestjs/terminus). Nest lazily
    # require()s these behind its optional-package loader, so leaving the
    # require unresolved is safe at runtime.
    #
    # They must be listed anyway: esbuild treats an unresolvable require()
    # as a hard error and silently falls back to a much cruder bundler,
    # which packages the entire monorepo node_modules. That is what pushed
    # the function past Netlify's 250 MB limit and failed the deploy.
    "@nestjs/microservices",
    "@nestjs/websockets",
    "@nestjs/sequelize",
    "@nestjs/typeorm",
    "@nestjs/mongoose",
    "@mikro-orm/core",
  ]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true
