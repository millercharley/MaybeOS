<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <meta charset="utf-8">
    <!--
      The door page, wearing the co-op's own branding (Charley, 2026-09-16):
      their logo, their name and their colour, so somebody standing at the
      door sees their community's front door rather than a form.

      The branding is fetched by `brand_()` in Code.gs and checked before it
      arrives here — the colour is a hex colour, the logo an https address —
      because both are written straight into CSS and HTML. A co-op with no
      branding set simply gets the plain version; nothing here is allowed to
      stand between a member and an unlocked door.
    -->
    <style>
      :root {
        --accent: <?= accent ?>;
        --on-accent: <?= accentInk ?>;
        --ink: #1d1b18;
        --muted: #6b665e;
        --line: #ddd7cc;
        --ground: #f7f4ee;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: var(--ink);
        background: var(--ground);
        /* A wash of the co-op's colour behind the card, so the page is theirs
           before a word is read. */
        background-image: linear-gradient(180deg, color-mix(in srgb, var(--accent) 28%, transparent), transparent 55%);
        background-repeat: no-repeat;
        min-height: 100vh;
      }
      main { max-width: 420px; margin: 0 auto; padding: 40px 20px 32px; }
      .masthead { text-align: center; margin-bottom: 28px; }
      /* The whole logo, whatever shape it is: a crop to a circle cuts the
         corners off a wordmark or a square mark (Charley, 2026-09-16). */
      .logo {
        display: block; margin: 0 auto 14px;
        max-width: 240px; max-height: 110px; width: auto; height: auto; object-fit: contain;
      }
      .org { font-size: 20px; font-weight: 700; letter-spacing: -0.01em; }
      .card {
        background: #fff; border: 1px solid var(--line); border-radius: 18px;
        padding: 24px 20px 26px; box-shadow: 0 10px 30px rgba(29, 27, 24, 0.07);
      }
      h1 { font-size: 22px; margin: 0 0 4px; }
      /* The doors, when there is more than one. Buttons rather than a select:
         it is one tap at a door, in the cold, holding a bag. */
      .doors { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 18px; }
      .doors button {
        width: auto; margin: 0; flex: 1 1 auto; padding: 10px 14px; font-size: 15px; font-weight: 600;
        border: 1px solid var(--line); border-radius: 999px; background: #fff; color: var(--ink);
      }
      .doors button[aria-pressed='true'] {
        background: var(--accent); color: var(--on-accent); border-color: transparent;
      }
      p.sub { margin: 0 0 22px; color: var(--muted); font-size: 14px; }
      label { display: block; font-size: 14px; font-weight: 600; margin: 16px 0 6px; }
      input {
        width: 100%; font-size: 18px; padding: 12px 14px; border: 1px solid var(--line);
        border-radius: 10px; background: #fff; color: var(--ink);
      }
      input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
      /* Capitals in a serif face, letter-spaced, so I and L read as themselves (DOR-01). */
      input#code {
        letter-spacing: 0.3em; text-transform: uppercase;
        font-family: Georgia, 'Times New Roman', serif; font-size: 22px; text-align: center;
      }
      button {
        width: 100%; margin-top: 24px; padding: 16px; font-size: 18px; font-weight: 700;
        border: 0; border-radius: 12px; background: var(--accent); color: var(--on-accent);
      }
      button:disabled { opacity: 0.55; }
      /* Letting guests in: a plainer button than Unlock, because it is the
         rarer thing and the bigger favour. */
      button.secondary {
        margin-top: 10px; background: #fff; color: var(--ink);
        border: 1px solid var(--line); font-size: 16px; font-weight: 600;
      }
      #status { min-height: 1.5em; margin-top: 18px; font-weight: 600; text-align: center; }
      #status.ok { color: #1f7a4d; }
      #status.bad { color: #b3261e; }
      .help { margin-top: 22px; font-size: 13px; color: var(--muted); text-align: center; }
    </style>
  </head>
  <body>
    <main data-door="<?= doorId ?>">
      <div class="masthead">
        <? if (logoUrl) { ?>
          <img class="logo" src="<?= logoUrl ?>" alt="<?= orgName ?>">
        <? } ?>
        <? if (orgName && !logoUrl) { ?>
          <!-- Only when there is no logo: most are a wordmark, and printing the
               name under one says it twice. The logo carries it as alt text. -->
          <div class="org"><?= orgName ?></div>
        <? } ?>
      </div>

      <div class="card">
        <? if (doorFound) { ?>
          <h1 id="door-name"><?= doorName ?></h1>
          <p class="sub">Enter your email and your five-letter door code.</p>

          <? if (doors.length > 1) { ?>
            <div class="doors" role="group" aria-label="Which door">
              <? for (var i = 0; i < doors.length; i++) { ?>
                <button type="button" class="door-choice" data-door="<?= doors[i].id ?>" aria-pressed="<?= doors[i].id === doorId ? 'true' : 'false' ?>">
                  <?= doors[i].name ?>
                </button>
              <? } ?>
            </div>
          <? } ?>

          <form id="unlock" autocomplete="on">
            <label for="email">Email</label>
            <input id="email" type="email" inputmode="email" autocomplete="email" autocapitalize="off" spellcheck="false" required>

            <label for="code">Door code</label>
            <input id="code" type="text" inputmode="text" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="5" required>

            <button id="go" type="submit">Unlock</button>
            <? if (holdMinutes > 0) { ?>
              <button id="hold" class="secondary" type="button">
                Hold doors open <?= holdMinutes ?> min for guests
              </button>
              <button id="lock" class="secondary" type="button" hidden>Lock the doors now</button>
            <? } ?>
          </form>
          <div id="status" role="status" aria-live="polite"></div>
          <p class="help">Your door code is on your My Profile page in MaybeOS.</p>
        <? } else { ?>
          <h1>Door not found</h1>
          <p class="sub">This link is not set up for a door. Ask an organiser for the right one.</p>
        <? } ?>
      </div>
    </main>

    <script>
      (function () {
        var form = document.getElementById('unlock');
        if (!form) return;

        var doorId = document.querySelector('main').getAttribute('data-door');
        var DOOR_KEY = 'door_choice';

        // Which door, when the co-op has more than one. The page opens on the
        // one an organiser made default, then remembers what this phone chose
        // last: most people come in the same way every time.
        var choices = [].slice.call(document.querySelectorAll('.door-choice'));
        if (choices.length) {
          var remembered = null;
          try { remembered = localStorage.getItem(DOOR_KEY); } catch (e) {}
          var match = choices.filter(function (b) { return b.getAttribute('data-door') === remembered; })[0];
          if (match) pick(match);

          choices.forEach(function (button) {
            button.addEventListener('click', function () {
              pick(button);
              try { localStorage.setItem(DOOR_KEY, doorId); } catch (e) {}
              show('');
            });
          });
        }

        function pick(button) {
          doorId = button.getAttribute('data-door');
          choices.forEach(function (b) { b.setAttribute('aria-pressed', String(b === button)); });
          var heading = document.getElementById('door-name');
          if (heading) heading.textContent = button.textContent.trim();
        }
        var email = document.getElementById('email');
        var code = document.getElementById('code');
        var button = document.getElementById('go');
        var statusEl = document.getElementById('status');
        var EMAIL_KEY = 'door_email';

        // Remember the email on this phone, never the code.
        try { email.value = localStorage.getItem(EMAIL_KEY) || ''; } catch (e) {}
        (email.value ? code : email).focus();

        code.addEventListener('input', function () {
          code.value = code.value.toUpperCase().replace(/[^A-Z]/g, '');
        });

        function show(text, tone) {
          statusEl.textContent = text;
          statusEl.className = tone || '';
        }

        function finish(res) {
          button.disabled = false;
          button.textContent = 'Unlock';
          var ok = Boolean(res && res.ok);
          show((res && res.message) || 'Something went wrong. Try again.', ok ? 'ok' : 'bad');
          if (ok) {
            code.value = '';
            try { localStorage.setItem(EMAIL_KEY, email.value.trim()); } catch (e) {}
          }
        }

        function send(lat, lon) {
          show('Checking…');
          google.script.run
            .withSuccessHandler(finish)
            .withFailureHandler(function () { finish({ ok: false, message: 'Could not reach the door. Check your signal and try again.' }); })
            .unlockDoor(email.value, code.value, lat, lon, doorId);
        }

        // Holding every door open for guests, and ending that early. Both ask
        // for the same email and code as an unlock.
        var hold = document.getElementById('hold');
        var lock = document.getElementById('lock');

        function guestAction(trigger, working, call, onDone) {
          trigger.addEventListener('click', function () {
            if (!email.value.trim() || !code.value.trim()) {
              show('Enter your email and your door code first.', 'bad');
              return;
            }
            var was = trigger.textContent;
            trigger.disabled = true;
            trigger.textContent = working;
            show('Checking…');
            withLocation(function (lat, lon) {
              google.script.run
                .withSuccessHandler(function (res) {
                  trigger.disabled = false;
                  trigger.textContent = was;
                  show((res && res.message) || 'Something went wrong. Try again.', res && res.ok ? 'ok' : 'bad');
                  if (res && res.ok) onDone();
                })
                .withFailureHandler(function () {
                  trigger.disabled = false;
                  trigger.textContent = was;
                  show('Could not reach the door. Check your signal and try again.', 'bad');
                })
                [call](email.value, code.value, lat, lon);
            });
          });
        }

        if (hold && lock) {
          guestAction(hold, 'Unlocking…', 'holdDoorsOpen', function () {
            hold.hidden = true;
            lock.hidden = false;
            code.value = '';
          });
          guestAction(lock, 'Locking…', 'lockDoorsNow', function () {
            lock.hidden = true;
            hold.hidden = false;
            code.value = '';
          });
        }

        /** The member's position, or blanks: the same answer an unlock uses. */
        function withLocation(then) {
          if (!navigator.geolocation) { then('', ''); return; }
          var settled = false;
          var fallback = setTimeout(function () {
            if (!settled) { settled = true; then('', ''); }
          }, 8000);
          navigator.geolocation.getCurrentPosition(
            function (pos) {
              if (settled) return;
              settled = true; clearTimeout(fallback);
              then(pos.coords.latitude, pos.coords.longitude);
            },
            function (err) {
              if (settled) return;
              settled = true; clearTimeout(fallback);
              then(err && err.code === 1 ? 'denied' : '', '');
            },
            { enableHighAccuracy: true, timeout: 7000, maximumAge: 30000 }
          );
        }

        form.addEventListener('submit', function (event) {
          event.preventDefault();
          if (button.disabled) return;
          button.disabled = true;
          button.textContent = 'Unlocking…';

          show('Finding your location…');
          withLocation(send);
        });
      })();
    </script>
  </body>
</html>
