<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <meta charset="utf-8">
    <style>
      :root { --ink: #1d1b18; --muted: #6b665e; --line: #ddd7cc; --ground: #f7f4ee; --ok: #1f7a4d; --bad: #b3261e; }
      * { box-sizing: border-box; }
      body { margin: 0; font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: var(--ink); background: var(--ground); }
      main { max-width: 420px; margin: 0 auto; padding: 32px 20px; }
      h1 { font-size: 26px; margin: 0 0 4px; }
      p.sub { margin: 0 0 24px; color: var(--muted); }
      label { display: block; font-size: 14px; font-weight: 600; margin: 16px 0 6px; }
      input { width: 100%; font-size: 18px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: #fff; color: var(--ink); }
      /* Capitals in a serif face, letter-spaced, so I and L read as themselves (DOR-01). */
      input#code { letter-spacing: 0.3em; text-transform: uppercase; font-family: Georgia, 'Times New Roman', serif; }
      button { width: 100%; margin-top: 24px; padding: 16px; font-size: 18px; font-weight: 600; border: 0; border-radius: 12px; background: var(--ink); color: #fff; }
      button:disabled { opacity: 0.55; }
      #status { min-height: 1.5em; margin-top: 18px; font-weight: 600; text-align: center; }
      #status.ok { color: var(--ok); }
      #status.bad { color: var(--bad); }
      .help { margin-top: 28px; font-size: 13px; color: var(--muted); text-align: center; }
    </style>
  </head>
  <body>
    <main data-door="<?= doorId ?>" data-found="<?= doorFound ? 'yes' : 'no' ?>">
      <? if (doorFound) { ?>
        <h1><?= doorName ?></h1>
        <p class="sub">Enter your email and your five-letter door code.</p>

        <form id="unlock" autocomplete="on">
          <label for="email">Email</label>
          <input id="email" type="email" inputmode="email" autocomplete="email" autocapitalize="off" spellcheck="false" required>

          <label for="code">Door code</label>
          <input id="code" type="text" inputmode="text" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="5" required>

          <button id="go" type="submit">Unlock</button>
        </form>
        <div id="status" role="status" aria-live="polite"></div>
        <p class="help">Your door code is on your My Profile page in MaybeOS.</p>
      <? } else { ?>
        <h1>Door not found</h1>
        <p class="sub">This link is not set up for a door. Ask an organiser for the right one.</p>
      <? } ?>
    </main>

    <script>
      (function () {
        var form = document.getElementById('unlock');
        if (!form) return;

        var doorId = document.querySelector('main').getAttribute('data-door');
        var email = document.getElementById('email');
        var code = document.getElementById('code');
        var button = document.getElementById('go');
        var statusEl = document.getElementById('status');
        var EMAIL_KEY = 'door_email';

        // Remember the email on this phone, never the code.
        try { email.value = localStorage.getItem(EMAIL_KEY) || ''; } catch (e) {}
        (email.value ? code : email).focus();

        code.addEventListener('input', function () {
          code.value = code.value.toUpperCase().replace(/[^A-Z]/g, '');
        });

        function show(text, tone) {
          statusEl.textContent = text;
          statusEl.className = tone || '';
        }

        function finish(res) {
          button.disabled = false;
          button.textContent = 'Unlock';
          var ok = Boolean(res && res.ok);
          show((res && res.message) || 'Something went wrong. Try again.', ok ? 'ok' : 'bad');
          if (ok) {
            code.value = '';
            try { localStorage.setItem(EMAIL_KEY, email.value.trim()); } catch (e) {}
          }
        }

        function send(lat, lon) {
          show('Checking…');
          google.script.run
            .withSuccessHandler(finish)
            .withFailureHandler(function () { finish({ ok: false, message: 'Could not reach the door. Check your signal and try again.' }); })
            .unlockDoor(email.value, code.value, lat, lon, doorId);
        }

        form.addEventListener('submit', function (event) {
          event.preventDefault();
          if (button.disabled) return;
          button.disabled = true;
          button.textContent = 'Unlocking…';

          if (!navigator.geolocation) { send('', ''); return; }

          show('Finding your location…');
          var settled = false;
          var fallback = setTimeout(function () {
            if (!settled) { settled = true; send('', ''); }
          }, 8000);

          navigator.geolocation.getCurrentPosition(
            function (pos) {
              if (settled) return;
              settled = true; clearTimeout(fallback);
              send(pos.coords.latitude, pos.coords.longitude);
            },
            function (err) {
              if (settled) return;
              settled = true; clearTimeout(fallback);
              send(err && err.code === 1 ? 'denied' : '', '');
            },
            { enableHighAccuracy: true, timeout: 7000, maximumAge: 30000 }
          );
        });
      })();
    </script>
  </body>
</html>
